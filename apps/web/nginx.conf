# Docker's DNS, re-read every 10 s: nginx starts before `api` resolves and follows the
# container when Compose recreates it. The short timeout bounds a failed lookup to seconds.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Reuses idle connections to the API. Without keepalive nginx opened one connection per
# request, and the API's Node accepts one pending connection per event-loop iteration.
upstream api_backend {
  zone api_backend 64k;
  server api:3000 resolve;
  keepalive 256;
  keepalive_requests 10000;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  keepalive_requests 10000;

  gzip on;
  gzip_min_length 256;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_connect_timeout 5s;
  proxy_send_timeout 15s;
  proxy_read_timeout 15s;

  location /api/ {
    proxy_pass http://api_backend;
  }

  location = /health {
    proxy_pass http://api_backend;
  }

  location / {
    try_files $uri /index.html;
  }
}
