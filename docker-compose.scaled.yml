services:
  api:
    environment:
      APP_ROLE: api
    ports: !reset []

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ROLE: worker
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-flash_sale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flash_sale}
      POSTGRES_DB: ${POSTGRES_DB:-flash_sale}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENABLE_ADMIN_ENDPOINTS: ${ENABLE_ADMIN_ENDPOINTS:-true}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      SALE_STARTS_AT: ${SALE_STARTS_AT:-}
      SALE_ENDS_AT: ${SALE_ENDS_AT:-}
      SALE_TOTAL_STOCK: ${SALE_TOTAL_STOCK:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
