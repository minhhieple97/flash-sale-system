name: flash-sale

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flash_sale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flash_sale}
      POSTGRES_DB: ${POSTGRES_DB:-flash_sale}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-flash_sale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flash_sale}
      POSTGRES_DB: ${POSTGRES_DB:-flash_sale}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENABLE_ADMIN_ENDPOINTS: ${ENABLE_ADMIN_ENDPOINTS:-true}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      SALE_STARTS_AT: ${SALE_STARTS_AT:-}
      SALE_ENDS_AT: ${SALE_ENDS_AT:-}
      SALE_TOTAL_STOCK: ${SALE_TOTAL_STOCK:-}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  k6:
    image: grafana/k6:1.8.3
    profiles: ["stress"]
    environment:
      BASE_URL: http://api:3000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    volumes:
      - ./tests/stress:/scripts:ro
    command: ["run", "/scripts/oversell-stress.k6.js"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
